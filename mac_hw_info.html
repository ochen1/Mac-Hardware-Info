<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mac Hardware Info - QR Code Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f7;
            color: #1d1d1f;
        }
        h1 {
            text-align: center;
            color: #1d1d1f;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0,113,227,0.2);
        }
        button {
            background: #0071e3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
        }
        button:hover {
            background: #0077ed;
        }
        button:disabled {
            background: #999;
            cursor: not-allowed;
        }
        #qrcode {
            text-align: center;
            padding: 20px;
        }
        #qrcode canvas {
            max-width: 100%;
            height: auto;
        }
        .error {
            color: #ff3b30;
            background: #ffebea;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
        }
        .success {
            color: #34c759;
            background: #e8f8eb;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
        }
        .info {
            color: #666;
            font-size: 14px;
            margin-top: 12px;
        }
        .download-btn {
            background: #34c759;
            margin-top: 12px;
        }
        .download-btn:hover {
            background: #30d158;
        }
        code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
        .instructions {
            background: #f0f7ff;
            border-left: 4px solid #0071e3;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
        }
        .instructions ol {
            margin: 8px 0;
            padding-left: 20px;
        }
        .instructions li {
            margin: 6px 0;
        }
    </style>
</head>
<body>
    <h1>🖥️ Mac Hardware Info</h1>
    
    <div class="instructions">
        <strong>Instructions:</strong>
        <ol>
            <li>Run <code>python3 mac_hw_info_json.py</code> on your Mac</li>
            <li>Copy the JSON output</li>
            <li>Paste it below and click "Generate QR Code"</li>
        </ol>
    </div>

    <div class="container">
        <label for="jsonInput">Paste JSON from mac_hw_info_json.py:</label>
        <textarea id="jsonInput" placeholder='{
  "inner": {
    "product_name": "MacBook Pro",
    "io_mac_address": "a1b2c3d4e5f6",
    ...
  },
  "version": "14.0",
  ...
}'></textarea>
        <button id="generateBtn" onclick="generateQR()">Generate QR Code</button>
        <div id="message"></div>
    </div>

    <div class="container" id="qrContainer" style="display:none;">
        <h3 style="text-align:center; margin-top:0;">Generated QR Code</h3>
        <div id="qrcode"></div>
        <button class="download-btn" onclick="downloadQR()">Download QR Code (PNG)</button>
        <button onclick="downloadBin()">Download Binary (.bin)</button>
        <p class="info" style="text-align:center;">Scan this QR code with the OpenBubbles app</p>
    </div>

    <!-- Protobuf encoder (minimal implementation) -->
    <script>
    // Minimal protobuf encoder for our specific message structure
    const ProtobufEncoder = {
        // Write a varint
        writeVarint: function(value) {
            const bytes = [];
            while (value > 127) {
                bytes.push((value & 0x7F) | 0x80);
                value >>>= 7;
            }
            bytes.push(value & 0x7F);
            return bytes;
        },

        // Write a length-delimited field
        writeLengthDelimited: function(fieldNum, data) {
            const bytes = [];
            // Tag: fieldNum << 3 | wireType (2 for length-delimited)
            bytes.push(...this.writeVarint((fieldNum << 3) | 2));
            bytes.push(...this.writeVarint(data.length));
            bytes.push(...data);
            return bytes;
        },

        // Write a string field
        writeString: function(fieldNum, str) {
            const encoder = new TextEncoder();
            const strBytes = encoder.encode(str);
            return this.writeLengthDelimited(fieldNum, Array.from(strBytes));
        },

        // Write a bytes field (from hex string)
        writeBytes: function(fieldNum, hexStr) {
            if (!hexStr) return [];
            const bytes = [];
            for (let i = 0; i < hexStr.length; i += 2) {
                bytes.push(parseInt(hexStr.substr(i, 2), 16));
            }
            return this.writeLengthDelimited(fieldNum, bytes);
        },

        // Write a varint field
        writeVarintField: function(fieldNum, value) {
            const bytes = [];
            // Tag: fieldNum << 3 | wireType (0 for varint)
            bytes.push(...this.writeVarint((fieldNum << 3) | 0));
            bytes.push(...this.writeVarint(value));
            return bytes;
        },

        // Encode InnerHwInfo message
        encodeInnerHwInfo: function(inner) {
            let bytes = [];
            if (inner.product_name) bytes.push(...this.writeString(1, inner.product_name));
            if (inner.io_mac_address) bytes.push(...this.writeBytes(2, inner.io_mac_address));
            if (inner.platform_serial_number) bytes.push(...this.writeString(3, inner.platform_serial_number));
            if (inner.platform_uuid) bytes.push(...this.writeString(4, inner.platform_uuid));
            if (inner.root_disk_uuid) bytes.push(...this.writeString(5, inner.root_disk_uuid));
            if (inner.board_id) bytes.push(...this.writeString(6, inner.board_id));
            if (inner.os_build_num) bytes.push(...this.writeString(7, inner.os_build_num));
            if (inner.platform_serial_number_enc) bytes.push(...this.writeBytes(8, inner.platform_serial_number_enc));
            if (inner.platform_uuid_enc) bytes.push(...this.writeBytes(9, inner.platform_uuid_enc));
            if (inner.root_disk_uuid_enc) bytes.push(...this.writeBytes(10, inner.root_disk_uuid_enc));
            if (inner.rom) bytes.push(...this.writeBytes(11, inner.rom));
            if (inner.rom_enc) bytes.push(...this.writeBytes(12, inner.rom_enc));
            if (inner.mlb) bytes.push(...this.writeString(13, inner.mlb));
            if (inner.mlb_enc) bytes.push(...this.writeBytes(14, inner.mlb_enc));
            return bytes;
        },

        // Encode HwInfo message
        encodeHwInfo: function(hwInfo) {
            let bytes = [];
            if (hwInfo.inner) {
                const innerBytes = this.encodeInnerHwInfo(hwInfo.inner);
                bytes.push(...this.writeLengthDelimited(1, innerBytes));
            }
            if (hwInfo.version) bytes.push(...this.writeString(2, hwInfo.version));
            if (hwInfo.protocol_version) bytes.push(...this.writeVarintField(3, hwInfo.protocol_version));
            if (hwInfo.device_id) bytes.push(...this.writeString(4, hwInfo.device_id));
            if (hwInfo.icloud_ua) bytes.push(...this.writeString(5, hwInfo.icloud_ua));
            if (hwInfo.aoskit_version) bytes.push(...this.writeString(6, hwInfo.aoskit_version));
            return bytes;
        },

        // Create full payload with OABS prefix
        createPayload: function(hwInfo) {
            const encoder = new TextEncoder();
            const prefix = encoder.encode('OABS');
            const protobufBytes = this.encodeHwInfo(hwInfo);
            
            // OABS + 0x00 (prevent_sharing=false) + protobuf
            const payload = new Uint8Array(prefix.length + 1 + protobufBytes.length);
            payload.set(prefix, 0);
            payload[prefix.length] = 0; // prevent_sharing = false
            payload.set(protobufBytes, prefix.length + 1);
            
            return payload;
        }
    };

    // Global state
    let currentPayload = null;

    function showMessage(msg, isError) {
        const el = document.getElementById('message');
        el.className = isError ? 'error' : 'success';
        el.textContent = msg;
        el.style.display = 'block';
    }

    function generateQR() {
        const jsonInput = document.getElementById('jsonInput').value.trim();
        const messageEl = document.getElementById('message');
        messageEl.style.display = 'none';

        if (!jsonInput) {
            showMessage('Please paste JSON data', true);
            return;
        }

        let hwInfo;
        try {
            hwInfo = JSON.parse(jsonInput);
        } catch (e) {
            showMessage('Invalid JSON: ' + e.message, true);
            return;
        }

        // Validate required fields
        if (!hwInfo.inner) {
            showMessage('Invalid JSON: missing "inner" object', true);
            return;
        }

        try {
            // Create payload
            currentPayload = ProtobufEncoder.createPayload(hwInfo);
            
            // Clear previous QR
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = '';

            // Generate QR code
            // Convert to ISO-8859-1 string for binary data
            let dataStr = '';
            for (let i = 0; i < currentPayload.length; i++) {
                dataStr += String.fromCharCode(currentPayload[i]);
            }

            new QRCode(qrDiv, {
                text: dataStr,
                width: 300,
                height: 300,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            document.getElementById('qrContainer').style.display = 'block';
            showMessage('QR code generated successfully! Payload size: ' + currentPayload.length + ' bytes', false);
        } catch (e) {
            showMessage('Error generating QR: ' + e.message, true);
        }
    }

    function downloadQR() {
        const canvas = document.querySelector('#qrcode canvas');
        if (!canvas) {
            showMessage('No QR code to download', true);
            return;
        }

        const link = document.createElement('a');
        link.download = 'mac_hw_info_qr.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    function downloadBin() {
        if (!currentPayload) {
            showMessage('No payload to download', true);
            return;
        }

        const blob = new Blob([currentPayload], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.download = 'mac_hw_info.bin';
        link.href = URL.createObjectURL(blob);
        link.click();
        URL.revokeObjectURL(link.href);
    }
    </script>
</body>
</html>
